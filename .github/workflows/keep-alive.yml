name: Keep Hugging Face Space Awake

on:
  schedule:
    # Runs once every 24 hours at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to test it manually

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Space URL
        run: |
          curl -I -L "${{ secrets.SPACE_URL }}"
